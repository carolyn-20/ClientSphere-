services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clientsphere
      POSTGRES_PASSWORD: clientsphere
      POSTGRES_DB: clientsphere
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientsphere -d clientsphere"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      intelligence: { condition: service_started }
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]
  intelligence:
    build: ./services/intelligence
    ports: ["8000:8000"]
volumes:
  postgres_data:
