services:
  - type: web
    name: clientsphere-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
  - type: web
    name: clientsphere-web
    runtime: docker
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: clientsphere-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
